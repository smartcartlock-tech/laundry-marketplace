# Blueprint ל-Render. מציאות נוכחית (אומת 16.10.26): Neon free Postgres נפרד (eu-central-1) —
# אין PGSCHEMA בפרוד. DATABASE_URL מצביע ל-Neon (sync:false, מוזן ידנית בלוח Render).
services:
  - type: web
    name: laundry-marketplace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_MODE   # A2: demo|pilot — ברירת מחדל demo; לעבור ל-pilot רק ב-go-live (ראה docs/GO-LIVE.md)
        value: "demo"
      - key: SEED_DEMO
        value: "true"   # לסביבת הדמו בלבד — לכבות בפרודקשן אמיתי
      - key: DEMO_OTP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL   # Neon free Postgres (eu-central-1) — connection string מלא
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
